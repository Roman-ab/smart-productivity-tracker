name: Deploy to ECR and EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: |
        docker build -t tracker -f backend/Dockerfile ./backend

    - name: Tag image
      run: |
        docker tag tracker:latest ${{ steps.login-ecr.outputs.registry }}/tracker:latest

    - name: Push image to ECR
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/tracker:latest

    - name: Deploy on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

          sudo docker stop tracker || true
          sudo docker rm tracker || true

          sudo docker pull ${{ steps.login-ecr.outputs.registry }}/tracker:latest

          sudo docker run -d --restart unless-stopped --name tracker -p 80:8000 ${{ steps.login-ecr.outputs.registry }}/tracker:latest
