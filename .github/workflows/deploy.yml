name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu

            if [ ! -d "smart-productivity-tracker" ]; then
              git clone https://github.com/Roman-ab/smart-productivity-tracker.git
            fi

            cd smart-productivity-tracker

            git pull origin main

            sudo docker stop tracker || true
            sudo docker rm tracker || true

            sudo docker build -t tracker -f backend/Dockerfile ./backend

            sudo docker run -d --name tracker -p 80:3000 tracker
